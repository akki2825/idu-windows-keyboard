name: Build MSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Build exe
        run: |
          go-winres make
          go build -ldflags="-H windowsgui -s -w" -o "Idu Mishmi Keyboard.exe" .

      - name: Build MSIX
        run: .\packaging\build-msix.ps1

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: IduMishmiKeyboard
          path: IduMishmiKeyboard.msix
